name: Build RuangKarya APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RuangKaryaAndroid_EditorLengkap.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android
        uses: android-actions/setup-android@v3

      - name: Pasang Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek
        run: unzip -q RuangKaryaAndroid_EditorLengkap.zip -d source

      - name: Buat APK
        working-directory: source/RuangKaryaAndroid
        run: gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: RuangKarya-APK
          path: source/RuangKaryaAndroid/app/build/outputs/apk/debug/app-debug.apk
